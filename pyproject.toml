[project]
name = "macnotesapp"
version = "0.8.3"
description = "Work with Apple MacOS Notes.app from the command line. Also includes python interface for scripting Notes.app from your own python code."
authors = [{ name = "Rhet Turnbull", email = "rturnbull@gmail.com" }]
license = "MIT"
readme = "README.md"
keywords = ["cli", "mac", "macos", "notes", "apple-notes"]
classifiers = [
    "Environment :: Console",
    "Environment :: MacOS X",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "py-applescript>=1.0.3,<2.0.0",
    "click>=8.1.2,<9.0.0",
    "rich>=12.4.4",
    "markdown2>=2.4.3,<3.0.0",
    "tomli>=1.1.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "questionary>=1.10.0",
    "readability-lxml>=0.8.3,<0.9.0",
    "requests>=2.28.1,<3.0.0",
    "validators>=0.20.0,<1.0.0",
    "markdownify>=0.11.6,<2.0.0",
    "pyobjc-framework-ScriptingBridge>=9.0.1",
    "xdg-base-dirs>=6.0.0",
    "lxml-html-clean>=0.4.5",
    "lxml>=6.1.1,<7.0.0",
]

[project.urls]
Homepage = "https://github.com/RhetTbull/macnotesapp"
Repository = "https://github.com/RhetTbull/macnotesapp"

[project.scripts]
notes = "macnotesapp.__main__:cli_main"

[dependency-groups]
dev = [
    "pytest>=7.1.2",
    "cogapp>=3.3.0",
    "wheel>=0.37.1",
    "build>=0.8.3",
    "pyinstaller>=6.6.0",
    "bump2version>=1.0.1,<2.0.0",
    "mktestdocs>=0.2.4",
    "mkdocs>=1.6.1",
    "mkdocs-click>=0.8.3",
    "mkdocstrings>=0.27.0",
    "mkdocstrings-python>=1.12.2",
    "mkdocs-material>=9.5.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
